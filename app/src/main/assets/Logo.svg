<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#202434"/>
      <stop offset="55%" stop-color="#11131C"/>
      <stop offset="100%" stop-color="#07080D"/>
    </radialGradient>
    <linearGradient id="eqGrad" x1="0" y1="90" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="metal" x1="60" y1="46" x2="196" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#EEF1F8"/>
      <stop offset="100%" stop-color="#D8DFEC"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- Precision concentric vinyl grooves -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="128" cy="114" r="60" stroke-width="1.4" stroke-opacity="0.16"/>
    <circle cx="128" cy="114" r="54" stroke-width="1.4" stroke-opacity="0.22"/>
    <circle cx="128" cy="114" r="48" stroke-width="1.4" stroke-opacity="0.15"/>
    <circle cx="128" cy="114" r="43" stroke-width="1.2" stroke-opacity="0.20"/>
  </g>
  <!-- Bottom vinyl rim arc between stem and leg -->
  <path d="M98,176 A69,69 0 0 0 144,180" fill="none" stroke="url(#metal)" stroke-width="10" stroke-linecap="butt"/>
  <!-- Outer Vinyl R silhouette (outer arc + left stem + right diagonal leg) -->
  <path fill="none" stroke="url(#metal)" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter"
        d="M60,114 A68,68 0 1 1 164,171 L192,199 L167,199 L127,151"/>
  <!-- Left vertical stem -->
  <path fill="none" stroke="url(#metal)" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter"
        d="M60,114 L60,199 L88,199 L88,114"/>
  <!-- Inner vinyl label ring -->
  <circle cx="128" cy="114" r="37" fill="#0B0D14" stroke="url(#metal)" stroke-width="10"/>
  <!-- Three glowing violet-to-coral equalizer bars -->
  <rect x="108.5" y="100" width="8.5" height="28" rx="4.25" fill="url(#eqGrad)"/>
  <rect x="123.75" y="89" width="8.5" height="50" rx="4.25" fill="url(#eqGrad)"/>
  <rect x="139" y="100" width="8.5" height="28" rx="4.25" fill="url(#eqGrad)"/>
</svg>