name: ReChord Feature Preview APK

on:
  push:
    branches:
      - feature/audio-fidelity-ui-optimization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rechord-fidelity-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK 27
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION=27.0.12077973
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then echo "Android SDK root missing"; exit 1; fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION" &&
               [ -x "$SDK_ROOT/ndk/$NDK_VERSION/ndk-build" ]; then exit 0; fi
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1

      - name: Run fidelity and freeze-clock tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDevDebugUnitTest -Pbitchord.bundleWear=false \
            --build-cache --max-workers=3 --stacktrace

      - name: Prepare preview debug signing key
        shell: bash
        env:
          PREVIEW_DEBUG_KEYSTORE_BASE64: ${{ secrets.PREVIEW_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # The arm64-only Gradle setting points debug signing at this keystore.
          if [ -n "$PREVIEW_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$PREVIEW_DEBUG_KEYSTORE_BASE64" | base64 --decode > ci-debug.keystore
          else
            keytool -genkeypair -noprompt -keystore ci-debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ReChord Preview, OU=Android, O=ReChord, C=PH"
            echo "::warning::Temporary preview signing key; set PREVIEW_DEBUG_KEYSTORE_BASE64 to retain install-over-install compatibility."
          fi

      - name: Assemble ARM64-only ReChord Preview APK
        run: |
          ./gradlew :app:assembleDevDebug -Pbitchord.bundleWear=false \
            -PbitchordArm64Only=true --build-cache --max-workers=3 --stacktrace

      - name: Verify preview application ID
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/dev/debug/*arm64-v8a*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one arm64-v8a Preview APK; found ${#apks[@]}"
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          apk="${apks[0]}"
          "$tools/apksigner" verify "$apk"
          "$tools/aapt" dump badging "$apk" | grep -q "package: name='com.rechord.preview' "
          mkdir -p preview-assets
          cp "$apk" preview-assets/ReChord-Preview-arm64-v8a.apk

      - name: Upload ReChord Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: ReChord-Fidelity-UI-Preview-arm64-v8a-${{ github.run_number }}
          path: preview-assets/ReChord-Preview-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
