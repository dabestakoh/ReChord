name: ReChord Preview 1.9.2.3 Safe Optimizations

on:
  push:
    branches: [feature/1.9.2.3-safe-optimizations]
  workflow_dispatch:

concurrency:
  group: playlist-cache-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playlist-cache-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android NDK with retry for corrupt SDK downloads
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.0.12077973"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK location is not configured"
            exit 1
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found"
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION" &&
               [ -x "$SDK_ROOT/ndk/$NDK_VERSION/ndk-build" ]; then
              echo "Verified Android NDK $NDK_VERSION"
              exit 0
            fi
            echo "::warning::NDK installation failed (attempt $attempt/3); cleaning partial installation"
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::Unable to install Android NDK $NDK_VERSION after three attempts"
          exit 1
      - name: Restore persistent Preview signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "ci-debug.keystore"
          keytool -list -keystore "ci-debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null
      - name: Test playlist chronology, pagination and addon behavior
        run: |
          chmod +x gradlew
          ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.playlist.PlaylistIndexBuilderTest' \
            --tests 'com.music.bitchord.data.playlist.PlaylistChronologyTest' \
            --tests 'com.music.bitchord.data.playlist.PlaylistMetadataTest' \
            --build-cache --max-workers=3 --stacktrace
          ./gradlew :app:testDevDebugUnitTest --tests 'com.music.bitchord.AddonSourceTest' \
            --tests 'com.music.bitchord.AddonPolicyTest' \
            --tests 'com.music.bitchord.DetailScreenQueueTest' \
            --build-cache --max-workers=3 --stacktrace
      - name: Assemble signed ARM64 Preview
        run: |
          ./gradlew :app:assembleDevDebug -PbitchordArm64Only=true -Pbitchord.bundleWear=false \
            --build-cache --parallel --max-workers=3 --stacktrace
      - name: Verify Preview signature, package and version
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          shopt -s nullglob
          apks=(app/build/outputs/apk/dev/debug/*arm64-v8a*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one ARM64 Preview APK, found ${#apks[@]}"
            exit 1
          fi
          "$TOOLS/apksigner" verify --verbose "${apks[0]}"
          actual=$("$TOOLS/apksigner" verify --print-certs "${apks[0]}" |
            sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+)[[:space:]]*$/\1/p' |
            head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')
          expected=$(keytool -exportcert -keystore "ci-debug.keystore" \
            -storepass android -alias androiddebugkey 2>/dev/null |
            sha256sum | awk '{print $1}')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Preview signer does not match persistent debug key"
            exit 1
          fi
          info=$("$TOOLS/aapt" dump badging "${apks[0]}")
          grep -q "package: name='com.rechord.preview' " <<< "$info"
          grep -q "versionName='1.9.2.3'" <<< "$info"
          echo "Preview signer, package and version verified"
      - name: Upload Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: ReChord-Preview-1.9.2.3-safe-optimizations-arm64
          path: app/build/outputs/apk/dev/debug/*arm64-v8a*.apk
          if-no-files-found: error
          compression-level: 0
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-cache-test-reports
          path: |
            shared/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
