name: ReChord Feature Unit Tests

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      build_test_apk:
        description: 'Build signed arm64 ReChord Preview test APK (fix/feature branches only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Only the newest commit on each feature branch needs to finish CI.
concurrency:
  group: rechord-feature-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Kotlin compile + unit tests (no APK)
    # Manual dispatch should not build main or develop.
    if: startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      # testDevDebugUnitTest depends on the DevDebug Kotlin compilation tasks.
      # This catches Kotlin/Compose compiler failures as well as failing tests,
      # without assembling, signing or uploading an Android APK.
      - name: Compile and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDevDebugUnitTest -Pbitchord.bundleWear=false \
            --build-cache --max-workers=3 --console=plain

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feature-unit-test-report-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 5

  preview-test-apk:
    name: Manual signed ARM64 Preview test APK
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.build_test_apk == true &&
      (startsWith(github.ref, 'refs/heads/fix/') ||
       startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout requested fix branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android NDK
        shell: bash
        run: |
          set -euo pipefail
          version="27.0.12077973"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then manager="$(command -v sdkmanager || true)"; fi
          test -x "$manager"
          for attempt in 1 2 3; do
            if "$manager" --sdk_root="$sdk" --install "ndk;$version" &&
               [ -x "$sdk/ndk/$version/ndk-build" ]; then exit 0; fi
            rm -rf "$sdk/ndk/$version"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::Unable to install Android NDK $version"
          exit 1

      - name: Restore the existing Preview signing certificate
        shell: bash
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Do not create a new debug key: it would prevent upgrades over the
          # existing installed com.rechord.preview package.
          encoded="${CI_DEBUG_KEYSTORE_BASE64:-}"
          if [ -z "$encoded" ]; then encoded="${DEBUG_KEYSTORE_BASE64:-}"; fi
          if [ -z "$encoded" ]; then encoded="${PREVIEW_KEYSTORE_BASE64:-}"; fi
          if [ -z "$encoded" ]; then encoded="${DEV_KEYSTORE_BASE64:-}"; fi
          if [ -z "$encoded" ]; then
            echo "::error::Existing Preview keystore secret not configured (CI_DEBUG_KEYSTORE_BASE64 / DEBUG_KEYSTORE_BASE64 / PREVIEW_KEYSTORE_BASE64 / DEV_KEYSTORE_BASE64)."
            exit 1
          fi
          umask 077
          printf '%s' "$encoded" | base64 --decode > ci-debug.keystore
          test -s ci-debug.keystore
          keytool -list -keystore ci-debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Compile signed ARM64 Preview APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug \
            -PbitchordArm64Only=true -Pbitchord.bundleWear=false \
            --build-cache --max-workers=3 --stacktrace --console=plain

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/dev/debug/*.apk)
          test "${#apks[@]}" -eq 1 || {
            echo "::error::Expected one ARM64 Preview APK, found ${#apks[@]}"; exit 1;
          }
          apk="${apks[0]}"
          tools="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" | grep -q "package: name='com.rechord.preview' "
          "$tools/aapt" dump badging "$apk" | grep -q "native-code: 'arm64-v8a'"
          mkdir -p preview-test-apk
          cp "$apk" "preview-test-apk/ReChord-Preview-handoff-${GITHUB_SHA:0:7}-arm64-v8a.apk"
          (cd preview-test-apk && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ReChord-Preview-handoff-${{ github.sha }}
          path: preview-test-apk/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
