name: ReChord Signed Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rechord-production-release
  cancel-in-progress: false

jobs:
  build-prod-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Android NDK installation with retry
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.0.12077973"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then echo "::error::Android SDK root missing"; exit 1; fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ ! -x "$SDKMANAGER" ]; then echo "::error::sdkmanager not found"; exit 1; fi
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION" &&
               [ -x "$SDK_ROOT/ndk/$NDK_VERSION/ndk-build" ]; then
              echo "NDK verified: $NDK_VERSION"
              exit 0
            fi
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::NDK installation failed after three attempts"
          exit 1

      - name: Read release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/.*bitchordVersionName.*= *"([^"]+)".*/\1/p' build.gradle.kts | head -n 1)"
          beta="$(sed -nE 's/.*bitchordBetaSuffix.*= *"([^"]*)".*/\1/p' build.gradle.kts | head -n 1)"
          test -n "$version"
          if [ -n "$beta" ]; then
            echo "::error::Release requires a blank beta suffix; found $beta"
            exit 1
          fi
          echo "RECHORD_VERSION=$version" >> "$GITHUB_ENV"
          echo "RECHORD_TAG=v$version" >> "$GITHUB_ENV"

      - name: Restore persistent production signing certificate
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done
          printf 'LASTFM_API_KEY=%s\nLASTFM_SECRET=%s\nLISTEN_TOGETHER_SERVER=%s\n' \
            "$LASTFM_API_KEY" "$LASTFM_SECRET" "$LISTEN_TOGETHER_SERVER" > local.properties
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > bitchord-release.p12
          test -s bitchord-release.p12
          keytool -list -storetype PKCS12 -keystore bitchord-release.p12 \
            -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          printf 'storeFile=bitchord-release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > keystore.properties

      - name: Build signed production APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleProdRelease -Pbitchord.bundleWear=false \
            --build-cache --max-workers=3 --stacktrace

      - name: Verify package, version and signing certificate
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          expected="$(keytool -exportcert -storetype PKCS12 -keystore bitchord-release.p12 \
            -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" 2>/dev/null | sha256sum | awk '{print $1}')"
          test -n "$expected"
          shopt -s nullglob
          apks=(app/build/outputs/apk/prod/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then echo "::error::No production APK"; exit 1; fi
          mkdir -p release-assets
          for apk in "${apks[@]}"; do
            "$tools/apksigner" verify --verbose "$apk"
            signer="$("$tools/apksigner" verify --print-certs "$apk" |
              sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+)[[:space:]]*$/\1/p' |
              head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
            if [ "$signer" != "$expected" ]; then echo "::error::Signing mismatch: $apk"; exit 1; fi
            info="$("$tools/aapt" dump badging "$apk")"
            grep -q "package: name='com.music.rechord' " <<< "$info"
            grep -q "versionName='$RECHORD_VERSION'" <<< "$info"
            name="$(basename "$apk")"
            case "$name" in
              *arm64-v8a*) suffix="_arm64-v8a" ;;
              *armeabi-v7a*) suffix="_armeabi-v7a" ;;
              *x86_64*) suffix="_x86_64" ;;
              *x86*) suffix="_x86" ;;
              *) suffix="" ;;
            esac
            target="release-assets/ReChord-$RECHORD_TAG$suffix.apk"
            if [ -e "$target" ]; then echo "::error::Duplicate APK asset: $target"; exit 1; fi
            cp "$apk" "$target"
            echo "Verified: $target"
          done
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReChord-${{ env.RECHORD_TAG }}-signed
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release and version tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/$RECHORD_TAG.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi
          if gh release view "$RECHORD_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A previously published build is immutable, but its release notes
            # can be clarified without changing the APKs or tag.
            gh release edit "$RECHORD_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "ReChord $RECHORD_VERSION" --notes-file "$notes"
            echo "Updated existing release notes; APK assets unchanged."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RECHORD_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RECHORD_TAG exists without a release. Manual review required."
            exit 1
          fi
          gh release create "$RECHORD_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ReChord $RECHORD_VERSION" \
            --notes-file "$notes" \
            --latest
