name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Restore and validate release signing key
      shell: bash
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      run: |
        set -euo pipefail
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD RELEASE_KEY_ALIAS; do
          if [ -z "${!name}" ]; then
            echo "::error::Missing required GitHub secret $name"
            exit 1
          fi
        done
        umask 077
        printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > bitchord-release.p12
        test -s bitchord-release.p12
        keytool -list -storetype PKCS12 -keystore bitchord-release.p12 \
          -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null

        {
          printf 'storeFile=%s\n' 'bitchord-release.p12'
          printf 'storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
          printf 'keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
          printf 'keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Verify release APK signature and version
      shell: bash
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      run: |
        set -euo pipefail
        build_tools="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
        signer="$ANDROID_HOME/build-tools/$build_tools/apksigner"
        aapt="$ANDROID_HOME/build-tools/$build_tools/aapt"
        expected="$(keytool -exportcert -storetype PKCS12 -keystore bitchord-release.p12 \
          -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" 2>/dev/null | sha256sum | awk '{print $1}')"
        test -n "$expected"
        shopt -s nullglob
        apks=(app/build/outputs/apk/prod/release/*.apk)
        if [ "${#apks[@]}" -eq 0 ]; then
          echo "::error::No production release APKs were generated"
          exit 1
        fi
        for apk in "${apks[@]}"; do
          "$signer" verify --verbose "$apk"
          actual="$("$signer" verify --print-certs "$apk" |
            sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+)[[:space:]]*$/\1/p' |
            head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Incorrect release APK signer: $apk"
            exit 1
          fi
          badging="$("$aapt" dump badging "$apk")"
          if ! grep -q "package: name='com.music.bitchord' " <<< "$badging" ||
             ! grep -q "versionName='1.9.2'" <<< "$badging"; then
            echo "::error::Incorrect package name or version in $apk"
            exit 1
          fi
          echo "Verified signed release: $(basename "$apk")"
        done

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
